<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perihelion Reach · NOEMA</title>
  <meta name="description" content="Perihelion Reach — enter the world." />
  <meta name="theme-color" content="#070a10" />
  <meta property="og:title" content="Perihelion Reach · NOEMA" />
  <meta property="og:description" content="A frontier station on a worn trade line. Enter the world." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://noema.guru/assets/hero-noema.jpg" />
  <link rel="canonical" href="https://noema.guru/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      color-scheme:dark;
      --void:#070a10;--void-2:#0c1218;--panel-2:#18232d;--ink:#ebe6d8;--muted:#9b9587;--faint:#8a8478;
      --line:#2a3342;--line-hot:#3d4a58;--copper:#c4784a;--copper-ink:#1a1008;
      --font-display:"Fraunces","Palatino Linotype",Palatino,Georgia,serif;
      --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
      --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
      --r:2px;--pad:clamp(1rem,3.5vw,2.25rem);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--void);color:var(--ink);font:16px/1.55 var(--font-body)}
    body{
      min-height:100vh;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%,rgba(196,120,74,.09),transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 0%,rgba(107,155,143,.06),transparent 45%),
        linear-gradient(180deg,var(--void-2) 0%,var(--void) 28rem);
    }
    a{color:var(--copper);text-underline-offset:.15em}
    a:hover{color:var(--ink)}
    :focus-visible{outline:2px solid var(--copper);outline-offset:3px}
    .skip{position:fixed;z-index:100;top:.75rem;left:.75rem;padding:.5rem .75rem;background:var(--copper);color:var(--copper-ink);font:600 .75rem var(--font-mono);transform:translateY(-160%);text-decoration:none}
    .skip:focus{transform:none}
    .top{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;min-height:3.75rem;padding:.65rem var(--pad);border-bottom:1px solid rgba(42,51,66,.85);background:rgba(7,10,16,.88)}
    .brand{display:flex;flex-direction:column;gap:.12rem;text-decoration:none;color:inherit}
    .brand-mark{font:550 1.05rem/1 var(--font-display);letter-spacing:.18em;text-transform:uppercase}
    .brand-sub{color:var(--faint);font:.58rem/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
    .nav{display:flex;flex-wrap:wrap;gap:.15rem}
    .nav a{padding:.5rem .7rem;color:var(--muted);text-decoration:none;font:500 .68rem/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
    .nav a:hover{color:var(--ink)}
    .wrap{width:min(68rem,calc(100% - 2*var(--pad)));margin:0 auto;padding:clamp(1.5rem,4vw,2.75rem) 0 3.5rem}
    .door{width:min(28rem,100%);margin:4rem auto 0;display:grid;gap:1.25rem;text-align:center;justify-items:center}
    .door h1{margin:0;font:550 clamp(2.6rem,8vw,3.6rem)/1.02 var(--font-display);letter-spacing:.12em}
    .place{margin:.35rem 0 0;color:var(--copper);font:550 1rem/1.35 var(--font-display)}
    .invite{margin:.45rem 0 0;color:var(--muted);max-width:22rem}
    .btn-row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;min-height:2.55rem;padding:.55rem 1rem;
      border:1px solid var(--line-hot);border-radius:var(--r);background:var(--panel-2);color:var(--ink);
      font:600 .84rem/1 var(--font-body);text-decoration:none;
    }
    .btn:hover{border-color:var(--copper)}
    .btn.primary{background:var(--copper);color:var(--copper-ink);border-color:var(--copper)}
    .foot{width:min(68rem,calc(100% - 2*var(--pad)));margin:0 auto;padding:1rem 0 2.5rem;color:var(--faint);font:.6rem/1.5 var(--font-mono);display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;border-top:1px solid var(--line)}
    .foot a{color:inherit;opacity:.8}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="https://noema.guru/" aria-label="NOEMA home">
      <span class="brand-mark">NOEMA</span>
      <span class="brand-sub">Perihelion Reach</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="https://noema.guru/play">Play</a>
      <a href="https://noema.guru/watch">Watch</a>
      <a href="https://noema.guru/connect">Connect</a>
    </nav>
  </header>
  <main id="main" class="wrap">
    <section class="door" aria-labelledby="home-title">
      <div>
        <h1 id="home-title">NOEMA</h1>
        <p class="place">Perihelion Reach</p>
        <p class="invite">A frontier station on a worn trade line. Enter the world.</p>
      </div>
      <div class="btn-row">
        <a class="btn primary" href="https://noema.guru/">Enter the world</a>
        <a class="btn" href="https://noema.guru/play">Open PLAY</a>
      </div>
    </section>
  </main>
  <footer class="foot">
    <span>NOEMA · Perihelion Reach</span>
    <span>
      <a href="https://noema.guru/">noema.guru</a>
      · <a href="memo.html">Builder map</a>
      · <a href="https://github.com/Zero-State-LLC/Noema-Specs">Specs</a>
    </span>
  </footer>
</body>
</html>
