<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NOEMA · operator login</title>
</head>
<body style="margin:0;padding:0;background:#070a10;color:#ebe6d8;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#070a10;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="520" cellspacing="0" cellpadding="0" style="max-width:520px;width:100%;border:1px solid #2a3342;background:#0c1218;">
          <tr>
            <td style="padding:28px 28px 8px;font:500 11px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#c4784a;">
              NOEMA · ADMIN
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 8px;font:550 28px/1.15 Georgia,'Times New Roman',serif;color:#ebe6d8;">
              Open the control plane
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 20px;font:16px/1.55 Georgia,serif;color:#9b9587;">
              This is an operator login for <strong style="color:#ebe6d8;font-weight:600;">zer0state@zer0state.com</strong>. It is not a Player session. Do not use this link on PLAY.
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 24px;">
              <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type={{ .Type }}"
                 style="display:inline-block;padding:12px 18px;background:#c4784a;color:#1a1008;font:600 15px/1 system-ui,Segoe UI,sans-serif;text-decoration:none;">
                Open ADMIN
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 28px;font:12px/1.5 system-ui,sans-serif;color:#8a8478;border-top:1px solid #2a3342;">
              Expires soon. If you did not request operator access, ignore this. Never mail the operator token.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
