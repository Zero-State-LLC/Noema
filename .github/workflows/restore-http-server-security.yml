name: restore-http-server-security
on:
  push:
    paths:
      - ".github/workflows/restore-http-server-security.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-codeql-gha-security-d22a
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and write http_server.py
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          b64 = """"""
          data = zlib.decompress(base64.b64decode(b64))
          path = Path("src/noema/gateway/http_server.py")
          path.write_bytes(data)
          print("wrote", path, len(data))
          assert b"commonpath" in data
          assert b"joinpath" in data
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/noema/gateway/http_server.py
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(security): restore http_server.py path confinement"
            git push
          fi
