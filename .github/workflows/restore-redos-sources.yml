name: restore-redos-sources
on:
  push:
    branches: [cursor/fix-worker-redos-d22a]
    paths:
      - 'workers/noema/src/.redos-payloads/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-worker-redos-d22a
          fetch-depth: 0
      - name: Restore ReDoS-fixed sources from patch
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- workers/noema/src/actions.ts workers/noema/src/world-actions.ts
          patch -p1 < workers/noema/src/.redos-payloads/redos-fix.patch
          rm -f workers/noema/src/.redos-fix-probe.txt \
                workers/noema/src/.redos-fix-probe2.txt \
                workers/noema/src/.redos-file-ref-probe.txt \
                workers/noema/src/.redos-obj-ref-probe.txt \
                workers/noema/src/.redos-size-probe.txt \
                workers/noema/src/.redos-write-test.txt \
                workers/noema/src/.redos-obj-ref-probe.txt
          rm -rf workers/noema/src/.redos-payloads
          rm -f .github/workflows/restore-redos-sources.yml
          python3 - <<'PY'
          from pathlib import Path
          a = Path('workers/noema/src/actions.ts').read_bytes()
          w = Path('workers/noema/src/world-actions.ts').read_bytes()
          print('actions', len(a), 'world', len(w))
          assert b'splitKeywordTail' in a
          assert b'parseCharterAssignment' in a
          assert b'askVerb' in w
          print('markers ok')
          PY
      - name: Commit restored sources
        run: |
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(security): eliminate polynomial ReDoS in worker command parsers"
          git push
