name: restore-redos-sources
on:
  push:
    branches: [cursor/fix-worker-redos-d22a]
    paths:
      - 'workers/noema/src/.redos-payloads/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-worker-redos-d22a
      - name: Decode ReDoS-fixed sources
        run: |
          python3 <<'PY'
          import base64, zlib, pathlib, shutil
          root = pathlib.Path('workers/noema/src')
          payload = root / '.redos-payloads'
          def join_parts(prefix):
            parts = sorted(payload.glob(prefix + '.part*'))
            if not parts:
              raise SystemExit('missing parts for ' + prefix)
            return ''.join(p.read_text().strip() for p in parts)
          for dst, prefix in [
            ('actions.ts', 'actions.ts.zlib.b64'),
            ('world-actions.ts', 'world-actions.ts.zlib.b64'),
          ]:
            b64 = join_parts(prefix)
            data = zlib.decompress(base64.b64decode(b64))
            (root / dst).write_bytes(data)
            print('wrote', dst, len(data))
          for junk in [
            root / '.redos-fix-probe.txt',
            root / '.redos-fix-probe2.txt',
            root / '.redos-file-ref-probe.txt',
            root / '.redos-obj-ref-probe.txt',
            root / '.redos-payloads',
          ]:
            if junk.is_file():
              junk.unlink(); print('removed', junk)
            elif junk.is_dir():
              shutil.rmtree(junk); print('removed dir', junk)
          wf = pathlib.Path('.github/workflows/restore-redos-sources.yml')
          if wf.exists():
            wf.unlink(); print('removed workflow')
          PY
      - name: Commit restored sources
        run: |
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(security): eliminate polynomial ReDoS in worker command parsers"
          git push
