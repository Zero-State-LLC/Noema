name: restore-cohort-security
on:
  push:
    paths:
      - ".github/workflows/restore-cohort-security.yml"
      - ".github/security-payloads/cohort.b64.*"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-codeql-gha-security-d22a
      - name: Decode and write cohort.py
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          b64 = Path(".github/security-payloads/cohort.b64.1").read_text().strip() + Path(".github/security-payloads/cohort.b64.2").read_text().strip()
          data = zlib.decompress(base64.b64decode(b64))
          path = Path("src/noema/cli/cohort.py")
          path.write_bytes(data)
          print("wrote", path, len(data))
          assert b"0o600" in data and b"fchmod" in data
          assert b"os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)" in data
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/noema/cli/cohort.py
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "fix(security): open() create mask 0600 then fchmod"
            git push
          fi
