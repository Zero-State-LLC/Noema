name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOEMA_OFFICIAL_CLIENT_REPO: ${{ github.workspace }}/../noema-client
      NOEMA_ESBUILD: ${{ github.workspace }}/workers/noema/node_modules/.bin/esbuild
      WRANGLER_SEND_METRICS: 'false'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: python -m pip install -e '.[dev]'
    - name: Check AGENTS.md contract
      run: python3 scripts/check_agents_md.py
    - name: Check out pinned Noema-Specs beside the workspace
      # Python conformance tests also consume sibling Specs artifacts.
      run: |
        set -euo pipefail
        PIN=$(python3 -c "import json;print(json.load(open('spec-compat.json'))['specs']['commit'])")
        git clone --quiet --filter=blob:none https://github.com/Zero-State-LLC/Noema-Specs.git "$GITHUB_WORKSPACE/../Noema-Specs"
        git -C "$GITHUB_WORKSPACE/../Noema-Specs" checkout --quiet "$PIN"
        echo "Noema-Specs at $PIN"
    - name: Set up Node for local boundary tests
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: workers/noema/package-lock.json
    - name: Install Worker dependencies for local boundary tests
      working-directory: workers/noema
      run: npm ci
    - name: Install pinned official client for local boundary tests
      run: |
        set -euo pipefail
        CLIENT_PIN=0a20e2e94b087d3cdc6da7e8b46a67f008fe80a3
        git clone --quiet --filter=blob:none https://github.com/scrimshawlife-ctrl/noema-client.git "$NOEMA_OFFICIAL_CLIENT_REPO"
        git -C "$NOEMA_OFFICIAL_CLIENT_REPO" checkout --quiet "$CLIENT_PIN"
        python -m venv "$NOEMA_OFFICIAL_CLIENT_REPO/.venv"
        "$NOEMA_OFFICIAL_CLIENT_REPO/.venv/bin/python" -m pip install -e "$NOEMA_OFFICIAL_CLIENT_REPO"
        "$NOEMA_OFFICIAL_CLIENT_REPO/.venv/bin/noema" --version
        test -x "$NOEMA_ESBUILD"
    # Only PostgreSQL still needs separately provisioned services. Keep its
    # existing skip reasons visible; client/Worker boundary tests now execute.
    - name: Run offline Python suite
      run: python -m pytest -q -ra

  worker:
    name: Worker regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/noema
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: workers/noema/package-lock.json
    - name: Check out pinned Noema-Specs beside the workspace
      # Cross-repo conformance tests require sibling fixtures and Git history.
      # Match the dispatch-only deploy gate's pin, never moving Specs main.
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        PIN=$(python3 -c "import json;print(json.load(open('spec-compat.json'))['specs']['commit'])")
        git clone --quiet --filter=blob:none https://github.com/Zero-State-LLC/Noema-Specs.git "$GITHUB_WORKSPACE/../Noema-Specs"
        git -C "$GITHUB_WORKSPACE/../Noema-Specs" checkout --quiet "$PIN"
        echo "Noema-Specs at $PIN"
    - name: Install Worker dependencies
      run: npm ci
    - name: Run complete Worker suite
      run: npm test -- --maxWorkers=1 --no-file-parallelism
    - name: Typecheck Worker
      # Preserve independent typecheck diagnostics even when tests fail.
      if: ${{ !cancelled() }}
      run: npm run typecheck
