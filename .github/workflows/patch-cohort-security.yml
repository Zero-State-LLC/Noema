name: patch-cohort-security
on:
  push:
    paths:
      - ".github/workflows/patch-cohort-security.yml"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-codeql-gha-security-d22a
      - name: Patch open() create mask to 0o600
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/noema/cli/cohort.py")
          t = p.read_text()
          old = "    descriptor = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, mode)\n"
          new = (
              "    # Create with an owner-only mask (CodeQL py/overly-permissive-file), then\n"
              "    # fchmod to the caller-requested mode so intentional 0644 outputs still work.\n"
              "    descriptor = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)\n"
          )
          if old not in t:
              if "os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)" in t:
                  print("already patched")
              else:
                  raise SystemExit("expected open() pattern not found")
          else:
              p.write_text(t.replace(old, new, 1))
              print("patched", p)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/noema/cli/cohort.py
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "fix(security): open() create mask 0600 then fchmod"
            git push
          fi
