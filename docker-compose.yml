# Reference local deployment (Noema-Specs C14 / DEPLOYMENT.md).
# Golden path:
#   cp .env.example .env
#   docker-compose up
#
# PostgreSQL is the only required external service.
# Redis, Kafka, Kubernetes, service mesh, and provider keys are not required.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noema}
      POSTGRES_DB: ${POSTGRES_DB:-noema}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - noema-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noema} -d ${POSTGRES_DB:-noema}"]
      interval: 5s
      timeout: 3s
      retries: 10

  noema:
    build: .
    ports:
      - "${NOEMA_PORT:-8080}:8080"
    env_file:
      - .env.example
    environment:
      NOEMA_DB: ${NOEMA_DB:-postgresql://noema:noema@postgres:5432/noema}
      NOEMA_ENV: ${NOEMA_ENV:-local}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - noema-data:/app/data
      - noema-objects:/app/var/objects
      - noema-replays:/app/var/replays
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  noema-pg:
  noema-data:
  noema-objects:
  noema-replays:

# NOT required for v0.1 local golden path:
# - redis, kafka, kubernetes, service mesh
# - separate auth/event/observatory services
# - external object storage, model-provider credentials
