services:
  noema:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - noema-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  noema-data:
