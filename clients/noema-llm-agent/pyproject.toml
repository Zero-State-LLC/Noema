[project]
name = "noema-llm-agent"
version = "1.1.0"
description = "NOEMA LLM Controller: model proposes, client transports, world decides."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "rich>=13.7",
  "typer>=0.12",
  "openai>=1.40",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
noema-llm-agent = "noema_llm_agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
