# Noema Stage 0 — Cloudflare Worker + World Durable Object
# Spec: Noema-Specs docs/PLATFORM.md
#
# Local:  npm run dev
# Deploy: npm run deploy  (requires CF account auth)
#
# Secrets (wrangler secret put …): never commit real values
#   TOKEN_SIGNING_SECRET
#   SUPABASE_JWT_SECRET
#   SUPABASE_SERVICE_ROLE_KEY   (optional for settlement)
#   SUPABASE_URL                (optional; also as var)

name = "noema-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Dashboard: https://dash.cloudflare.com/315fb44b61212825452aad0ca566ea42/home
account_id = "315fb44b61212825452aad0ca566ea42"

# Marketing splash + static assets (served after Worker routes fall through)
[assets]
directory = "./public"
binding = "ASSETS"
# Worker handles API + /play first; remaining paths use public/ (index, memo, assets, 404)
run_worker_first = true
# Disable clean-URL redirects (/index.html → /) — Worker maps paths explicitly
html_handling = "none"
not_found_handling = "none"

[vars]
NOEMA_ENV = "local"
NOEMA_PROTOCOL_VERSION = "1"
DEFAULT_WORLD_ID = "world-01"
POSTMARK_MESSAGE_STREAM = "outbound"

[[durable_objects.bindings]]
name = "WORLD_DO"
class_name = "NoemaWorldDO"

[[migrations]]
tag = "v1"
new_classes = ["NoemaWorldDO"]

# Operator digest tick — cadence gate is inside the DO (min 15m)
[triggers]
crons = ["*/15 * * * *"]

# Optional: bound secrets via dashboard / `wrangler secret put`
# TOKEN_SIGNING_SECRET
# SUPABASE_JWT_SECRET
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# ADMIN_OPERATOR_TOKEN   (operator plane; never to players)
# ADMIN_ALLOWLIST_EMAILS  (comma-separated operator mailboxes; never [vars])

# Worker-sent ADMIN magic-link mail (Email Routing fallback).
# Preferred outbound: RESEND_API_KEY secret (PLAY + ADMIN + agent bootstrap).
# Standby outbound: POSTMARK_SERVER_TOKEN.
[[send_email]]
name = "ADMIN_MAIL"
destination_address = "zer0state@zer0state.com"
