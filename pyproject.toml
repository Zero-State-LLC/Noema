[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "noema"
version = "0.1.0rc1"
description = "NOEMA World Engine runtime — v0.1 The Chamber"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Zero State LLC" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
noema-replay = "noema.cli.replay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noema"]

[tool.hatch.build.targets.sdist]
include = ["src/noema", "fixtures", "tests", "README.md", "pyproject.toml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
