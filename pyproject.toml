[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "noema"
version = "0.12.0"
description = "NOEMA World Engine runtime — complete frozen core loop modular monolith"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Zero-State-Proprietary" }
authors = [{ name = "Zero State LLC" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.1"]
# Convenience: local PLAY + production backend + tests
all = ["pytest>=8.0", "psycopg[binary]>=3.1"]

[project.scripts]
noema-replay = "noema.cli.replay:main"
noema-serve = "noema.cli.serve:main"
noema-play = "noema.cli.play:main"
noema-verify = "noema.cli.verify:main"
noema-backup = "noema.cli.backup:main"
noema-restore = "noema.cli.restore:main"
noema-keygen-evidence = "noema.cli.evidence:main_keygen"
noema-export-evidence = "noema.cli.evidence:main_export"
noema-verify-evidence = "noema.cli.evidence:main_verify"
noema-agent = "noema.cli.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noema"]

[tool.hatch.build.targets.sdist]
include = ["src/noema", "fixtures", "examples", "tests", "README.md", "pyproject.toml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: requires a live PostgreSQL DSN (NOEMA_TEST_PG_DSN or compose)",
]
