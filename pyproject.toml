[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "noema"
version = "0.4.0a1"
description = "NOEMA World Engine runtime — Chamber + Frontier + Observatory + Lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Zero-State-Proprietary" }
authors = [{ name = "Zero State LLC" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
noema-replay = "noema.cli.replay:main"
noema-serve = "noema.cli.serve:main"
noema-play = "noema.cli.play:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noema"]

[tool.hatch.build.targets.sdist]
include = ["src/noema", "fixtures", "tests", "README.md", "pyproject.toml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
